<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías - Lista</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>

<!-- Llamada al componente Menu.html -->
<div th:replace="~{common/Menu :: menu-superior('categorias')}"></div>

<main class="container">
    <section class="hero-section">
        <h1>Gestión de Categorías</h1>
        <p>Listado general de categorías registradas.</p>
    </section>

    <div class="card full-width">
        <div class="table-header">
            <h3>Listado de Categorías</h3>
            <a th:href="@{/categorias/nueva}" class="btn btn-blue inline-btn">➕ Nueva Categoría</a>
        </div>

        <table class="data-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cat : ${categorias}">
                <td th:text="${cat.idCategoria}">1</td>
                <td th:text="${cat.nombre}">Nombre</td>
                <td th:text="${cat.descripcion}">Descripción</td>
                <td class="table-actions text-center">
                    <a th:href="@{/categorias/editar/{id}(id=${cat.idCategoria})}" class="btn-action edit">✏️ Editar</a>
                    <a th:href="@{/categorias/eliminar/{id}(id=${cat.idCategoria})}"
                       onclick="return confirm('¿Deseas eliminar esta categoría?');"
                       class="btn-action delete">🗑️ Eliminar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(categorias)}">
                <td colspan="4" class="empty-table">No hay categorías registradas.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer class="footer">
    <p>&copy; 2026 Sistema de Ventas | Todos los derechos reservados</p>
</footer>

</body>
</html>
