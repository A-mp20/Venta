<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<!--/*@thymesVar id="categoria" type="com.relaciones.Modelo.Entidad.Categoria"*/-->
<!--/*@thymesVar id="titulo" type="java.lang.String"*/-->
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario Categoría</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>

<div th:replace="~{common/Menu :: menu-superior('categorias')}"></div>

<main class="container">
    <section class="hero-section">
        <h1 th:text="${titulo}">Crear / Editar Categoría</h1>
    </section>

    <div class="card form-container">
        <form th:action="@{/categorias/Guardar}" th:object="${categoria}" method="post" class="crud-form">

            <input type="hidden" th:field="*{idCategoria}" />

            <div class="form-group">
                <label for="nombre">Nombre de la Categoría:</label>
                <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Lácteos, Electrónica..." required class="form-control" />
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" th:field="*{descripcion}" placeholder="Escribe una breve descripción..." rows="4" class="form-control"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-blue" th:text="${categoria.idCategoria != null ? 'Actualizar' : 'Guardar'}">Guardar</button>
                <a th:href="@{/categorias}" class="btn btn-secondary">Cancelar</a>
            </div>

        </form>
    </div>
</main>

</body>
</html>
