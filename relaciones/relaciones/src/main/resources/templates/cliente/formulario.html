<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<!--/*@thymesVar id="cliente" type="com.relaciones.Modelo.Entidad.Cliente"*/-->
<!--/*@thymesVar id="titulo" type="java.lang.String"*/-->
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario Cliente</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>

<div th:replace="~{common/Menu :: menu-superior('clientes')}"></div>

<main class="container">
    <section class="hero-section">
        <h1 th:text="${titulo}">Registrar / Editar Cliente</h1>
    </section>

    <div class="card form-container">
        <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post" class="crud-form">

            <!-- ID Oculto para detectar si es Creación o Actualización -->
            <input type="hidden" th:field="*{idCliente}" />

            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Carlos" required class="form-control" />
            </div>

            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" th:field="*{apellido}" placeholder="Ej. Pérez" required class="form-control" />
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" th:field="*{email}" placeholder="ejemplo@correo.com" required class="form-control" />
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" th:field="*{telefono}" placeholder="Ej. 3001234567" class="form-control" />
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-blue" th:text="${cliente.idCliente != null ? 'Actualizar Cliente' : 'Guardar Cliente'}">Guardar</button>
                <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<footer class="footer">
    <p>&copy; 2026 Sistema de Ventas | Todos los derechos reservados</p>
</footer>

</body>
</html>
